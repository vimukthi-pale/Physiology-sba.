<title>Physiology SBA Practice</title>

<style>
/* Layout: "bedside monitor" home (ECG strip + vitals) → topic tiles with progress rings → one-column question card with a tap-to-jump strip and thumb-reach action bar */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E7EBF2; --line:#D3D9E4;
  --ink:#111A2D; --muted:#58637A; --accent:#4136C7; --accent-ink:#FFFFFF; --accent-soft:#E6E4FB;
  --trace:#E0475B; --grid:#E9D9DC; --monitor:#FFFFFF;
  --ok:#14803C; --ok-soft:#DDF4E5; --bad:#C42B39; --bad-soft:#FBE3E5; --amber:#B4570A; --amber-soft:#FCEBD5;
  --f-display:ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-body:-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1120; --surface:#151B2D; --sunk:#1D2439; --line:#2A3250;
  --ink:#E8ECF6; --muted:#97A1B9; --accent:#8F89FF; --accent-ink:#0D1120; --accent-soft:#272A55;
  --trace:#FF6B7D; --grid:#2A2235; --monitor:#10162A;
  --ok:#4ADE80; --ok-soft:#123222; --bad:#FF8790; --bad-soft:#3B1A20; --amber:#FBBF24; --amber-soft:#3A2C10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#151B2D; --sunk:#1D2439; --line:#2A3250;
  --ink:#E8ECF6; --muted:#97A1B9; --accent:#8F89FF; --accent-ink:#0D1120; --accent-soft:#272A55;
  --trace:#FF6B7D; --grid:#2A2235; --monitor:#10162A;
  --ok:#4ADE80; --ok-soft:#123222; --bad:#FF8790; --bad-soft:#3B1A20; --amber:#FBBF24; --amber-soft:#3A2C10; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* monitor hero */
.monitor{position:relative;border-radius:22px;background:var(--monitor);border:1px solid var(--line);overflow:hidden;margin-bottom:18px}
.monitor .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:18px 20px 0}
.monitor h1{font-size:clamp(26px,5.4vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.monitor .sub{color:var(--muted);margin:6px 0 0;max-width:46ch}
.ecg{display:block;width:100%;height:96px}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.vital{padding:10px 14px 12px;border-left:1px solid var(--line);min-width:0}
.vital:first-child{border-left:0}
.vital .v{font-family:var(--f-mono);font-weight:700;font-size:clamp(20px,4.6vw,28px);line-height:1.1}
.vital .v small{font-size:.5em;color:var(--muted);font-weight:500;margin-left:2px}
.vital.hr .v{color:var(--trace)}
@media (max-width:520px){.vitals{grid-template-columns:repeat(2,1fr)}.vital:nth-child(3){border-left:0}.vital:nth-child(n+3){border-top:1px solid var(--line)}}

.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
@media (max-width:700px){.modes{grid-template-columns:1fr 1fr}.modes .mode.primary{grid-column:1/-1}}
.result + .group-h + .dots + .modes,.card .modes{grid-template-columns:1fr}
.mode{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:76px;transition:transform .12s}
.mode:active{transform:scale(.98)}
.mode strong{font-family:var(--f-display);font-weight:700;font-size:16px}
.mode span{color:var(--muted);font-size:14px;line-height:1.35}
.mode.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode.primary span{color:inherit;opacity:.82}
.mode.exam{border-color:var(--amber);background:var(--amber-soft)}
.mode.exam strong{color:var(--amber)}
.mode:disabled{opacity:.45;cursor:default}
.group-h{margin:4px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:grid;grid-template-columns:1fr 64px;gap:2px 12px;align-items:center;text-align:left;padding:14px 14px 14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-height:96px;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.98)}
.tile .abbr{font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--accent)}
.tile .name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2}
.tile .meta{color:var(--muted);font-size:14px}
.tile svg{grid-row:1/4;grid-column:2}
.ring-bg{stroke:var(--sunk)} .ring-ok{stroke:var(--ok)} .ring-bad{stroke:var(--bad)}
.ring-txt{fill:var(--ink);font-family:var(--f-mono);font-weight:700;font-size:15px}
.ring-sub{fill:var(--muted);font-family:var(--f-body);font-size:9px}
.foot{margin-top:28px;color:var(--muted);font-size:14px;max-width:62ch}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14px}

/* quiz */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin-bottom:12px}
.top .row{display:flex;align-items:center;gap:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px}
.iconbtn.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.where{flex:1;min-width:0}
.where .t{font-family:var(--f-display);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where .s{font-size:13px;color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:999px;background:var(--sunk);font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.streak.hot{background:var(--bad-soft);color:var(--trace)}
.streak svg{width:22px;height:14px}
.timer{font-family:var(--f-mono);font-weight:700;color:var(--amber)}
.dots{display:flex;gap:5px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:10px;color:var(--muted);cursor:pointer;padding:0;display:grid;place-items:center}
.dot.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dot.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.dot.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot.cur{outline:2.5px solid var(--ink);outline-offset:1.5px}
.dot.flag{box-shadow:inset 0 -4px 0 var(--amber)}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;position:relative}
.card.enter{animation:enter .28s ease-out}
.card.pulse{animation:pulse .6s ease-out}
.card.shake{animation:shake .38s ease-in-out}
@keyframes enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.qno{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.04em}
.stem p{margin:0 0 .7em}
.stem p:last-child{font-weight:700;margin-bottom:0}
.note{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:12px}
figure{margin:14px 0 4px;text-align:center}
figure img{border-radius:10px;border:1px solid var(--line);max-height:60vh;max-width:100%;height:auto;width:auto;cursor:zoom-in;background:#fff}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:38px 1fr 22px;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:58px;font-size:17px;line-height:1.35;transition:border-color .15s,background .15s,transform .1s}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .L{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);font-family:var(--f-mono);font-weight:700}
.opt .mark{font-weight:700;text-align:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .L{background:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .L{background:var(--ok);color:var(--surface)}
.opt.correct .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.55}
.verdict{scroll-margin-top:calc(130px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;margin:18px 0 10px;padding:14px 16px;border-radius:var(--r);font-family:var(--f-display);font-size:19px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict .big{font-size:30px;line-height:1}
.exp{display:flex;flex-direction:column;gap:8px}
details.xp{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
details.xp summary{list-style:none;display:flex;gap:10px;align-items:baseline;padding:12px 14px;cursor:pointer;font-weight:700}
details.xp summary::-webkit-details-marker{display:none}
details.xp summary .L{font-family:var(--f-mono);color:var(--muted)}
details.xp summary .tag{margin-left:auto;font-size:11px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
details.xp summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);margin-left:8px}
details.xp[open] summary::after{content:"−"}
details.xp.is-correct{border-color:var(--ok)}
details.xp.is-correct summary{background:var(--ok-soft);color:var(--ok)}
details.xp.is-correct summary .L,details.xp.is-correct summary .tag{color:var(--ok)}
details.xp.is-chosen summary{background:var(--bad-soft);color:var(--bad)}
details.xp.is-chosen summary .L,details.xp.is-chosen summary .tag{color:var(--bad)}
.xp .body{padding:10px 14px 14px}
.xp .body p{margin:0 0 .6em}
.xp .body p:last-child{margin-bottom:0}
.xp .empty{color:var(--muted);font-style:italic}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actions .in{max-width:820px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;cursor:pointer}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.src{margin-top:14px;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.result{display:grid;grid-template-columns:auto 1fr;gap:18px 22px;align-items:center}
.result h2{font-size:26px}
.result .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.result .stats b{display:block;font-family:var(--f-mono);font-size:22px;color:var(--ink)}
@media (max-width:520px){.result{grid-template-columns:1fr;justify-items:center;text-align:center}.result .stats{justify-content:center}}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.lock{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.lock input{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;padding:0 14px}
.lock input:focus{outline:3px solid var(--accent);outline-offset:1px}
.lock .err{color:var(--bad);min-height:1.4em;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
</style>

</head><body>
<div id="app" class="wrap"><p class="loading">Loading questions…</p></div>
<div id="actions" class="actions" hidden><div class="in">
  <button class="btn" id="prevBtn" type="button">Previous</button>
  <button class="btn go" id="nextBtn" type="button">Next</button>
</div></div>
<div id="lightbox" class="lightbox" hidden><img id="lbImg" alt=""></div>

/* ---------- ECG strip ---------- */
function startECG(canvas, bpm){
  if (ecgTimer) cancelAnimationFrame(ecgTimer);
  const ctx = canvas.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const trace = css.getPropertyValue('--trace').trim(), grid = css.getPropertyValue('--grid').trim();
  const dpr = window.devicePixelRatio || 1;
  let W, H;
  function size(){ W = canvas.clientWidth; H = canvas.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size();
  const beat = 60 / Math.max(40, Math.min(160, bpm));   // seconds per beat
  const pxPerSec = 110;
  function v(t){       // PQRST shape, t in seconds
    const x = (t % beat) / beat;
    const g = (m, s, a) => a * Math.exp(-((x - m) ** 2) / (2 * s * s));
    return g(.18,.025,.12) + g(.30,.008,-.12) + g(.33,.01,1) + g(.36,.009,-.28) + g(.58,.04,.25);
  }
  function draw(now){
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = grid; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 16){ ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 16){ ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
    const t0 = now / 1000;
    ctx.strokeStyle = trace; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.beginPath();
    for (let x = 0; x <= W; x += 2){
      const t = t0 - (W - x) / pxPerSec;
      const y = H * .66 - v(t) * H * .55;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    const yEnd = H * .66 - v(t0) * H * .55;
    ctx.fillStyle = trace; ctx.beginPath(); ctx.arc(W - 2, yEnd, 3.5, 0, 7); ctx.fill();
    if (!reduceMotion() && document.body.contains(canvas)) ecgTimer = requestAnimationFrame(draw);
  }
  draw(performance.now());
  window.addEventListener('resize', () => { if (document.body.contains(canvas)){ size(); draw(performance.now()); } }, {once: true});
}

  const good = all.filter(x => !x.q.noStem);
  let list, title;
  if (mode === 'mix'){ list = shuffle(good).slice(0, 20); title = 'Quick 20'; }
  else if (mode === 'exam'){ list = shuffle(good).slice(0, 30); title = 'Exam mode'; }
  else if (mode === 'unseen'){ list = shuffle(all.filter(x => !progress[x.q.id])); title = 'Unseen questions'; }
  else if (mode === 'flag'){ list = all.filter(x => flags[x.q.id]); title = 'Flagged'; }
  else { list = all.filter(x => progress[x.q.id] && !progress[x.q.id].ok); title = 'Mistakes'; }
  if (!list.length){ home(); return; }
  S = {title, list, i: 0, mode, picks: {}, start: Date.now()};
  streak = 0; render();
}

/* ---------- question ---------- */
function paras(arr){ return (arr || []).map(p => `<p>${esc(p)}</p>`).join(''); }
function figs(q, where){
  return (q.figs || []).filter(f => f.where === where).map(f => `<figure><img src="${f.src}" alt="Figure from the original question" loading="lazy" width="${f.w}" height="${f.h}"></figure>`).join('');
}
function chosenFor(q){
  if (S.mode === 'exam') return S.done ? S.picks[q.id] : null;
  if (S.mode === 'wrong') return S.picks && S.picks[q.id];
  return progress[q.id] && progress[q.id].c;
}
function dotClass(x, k){
  const q = x.q; let c = 'dot';
  if (S.mode === 'exam'){ const p = S.picks[q.id]; if (p) c += S.done ? (p === q.answer ? ' ok' : ' bad') : ' sel'; }
  else { const p = S.mode === 'wrong' ? (S.picks[q.id] ? {ok: S.picks[q.id] === q.answer} : null) : progress[q.id]; if (p) c += p.ok ? ' ok' : ' bad'; }
  if (flags[q.id]) c += ' flag';
  if (k === S.i) c += ' cur';
  return c;
}
function topBar(){
  const n = S.list.length;
  const examLive = S.mode === 'exam' && !S.done;
  const showDots = n <= 150;
  let h = `<div class="top"><div class="row">
      <button class="iconbtn" type="button" id="homeBtn" aria-label="Back to systems">←</button>
      <div class="where"><div class="t">${esc(S.title)}</div><div class="s mono">${S.i + 1} of ${n}${examLive ? ` · <span class="timer" id="timer"></span>` : ''}</div></div>
      ${S.mode !== 'exam' ? `<span class="streak ${streak >= 3 ? 'hot' : ''}" id="streak" title="Correct answers in a row">${BLIP}<span>${streak}</span></span>` : ''}
      <button class="iconbtn ${flags[S.list[S.i].q.id] ? 'on' : ''}" type="button" id="flagBtn" aria-pressed="${!!flags[S.list[S.i].q.id]}" aria-label="Flag for review">⚑</button>
    </div>`;
  if (showDots){
    h += `<div class="dots" id="dots" role="navigation" aria-label="Jump to question">` +
      S.list.map((x, k) => `<button class="${dotClass(x, k)}" type="button" data-k="${k}" aria-label="Question ${k + 1}">${k + 1}</button>`).join('') + `</div>`;
  } else h += `<div class="bar"><i style="width:${100 * (S.i + 1) / n}%"></i></div>`;
  return h + `</div>`;
}
function render(anim = true){
  if (S.i >= S.list.length) S.i = S.list.length - 1;
  const {topic, q} = S.list[S.i];
  const chosen = chosenFor(q);
  const examLive = S.mode === 'exam' && !S.done;
  const picked = examLive ? S.picks[q.id] : null;
  const answered = !!chosen;
  const t = MANIFEST.topics.find(x => x.slug === topic.slug) || {};
  let h = topBar() + `<article class="card ${anim ? 'enter' : ''}" id="card">
      <div class="qno"><span class="chip">${esc(t.abbr || '')}</span><span class="label">${esc(topic.title)} · Q${q.n}</span></div>
      ${q.noStem ? `<div class="note">The question text wasn't captured in the screenshots for this one. The options and explanations are complete.</div>` : ''}
      <div class="stem">${paras(q.stem)}</div>${figs(q, 'stem')}
      <div class="opts">`;
  for (const L of Object.keys(q.options)){
    let cls = '', mark = '';
    if (answered){ if (L === q.answer){ cls = 'correct'; mark = '✓'; } else if (L === chosen){ cls = 'wrong'; mark = '✗'; } else cls = 'dim'; }
    else if (picked === L) cls = 'picked';
    h += `<button class="opt ${cls}" type="button" data-letter="${L}" ${answered ? 'disabled' : ''}><span class="L">${L}</span><span>${esc(q.options[L])}</span><span class="mark">${mark}</span></button>`;
  }
  h += `</div></article><div id="reveal">${answered ? reveal(q, chosen) : ''}</div>
    ${examLive ? `<p class="hint">Exam mode: pick an answer and move on. You'll see answers and explanations when you finish.</p>` : ''}
    <p class="src">Source: ${esc(topic.title)} · question ${q.n}${q.of ? ' of ' + q.of : ''} · swipe left or right to move</p>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
  wire();
  const cur = document.querySelector('.dot.cur'); if (cur) cur.scrollIntoView({inline: 'center', block: 'nearest'});
  actions.hidden = false;
  const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');
  prev.disabled = S.i === 0;
  const last = S.i === S.list.length - 1;
  next.className = 'btn go';
  if (examLive){ next.textContent = last ? 'Finish exam' : 'Next'; if (last) next.className = 'btn warn'; }
  else next.textContent = last ? (S.mode === 'exam' ? 'Results' : 'Finish') : (answered ? 'Next' : 'Skip');
  tick();
}
function wire(){
  document.getElementById('homeBtn').onclick = () => { if (S.mode === 'exam' && !S.done && Object.keys(S.picks).length && !confirmExit()) return; home(); };
  document.getElementById('flagBtn').onclick = toggleFlag;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(b.dataset.letter));
  app.querySelectorAll('figure img').forEach(im => im.onclick = () => zoom(im.src));
  app.querySelectorAll('.dot').forEach(d => d.onclick = () => { S.i = +d.dataset.k; render(); });
}
let exitArmed = 0;
function confirmExit(){
  const b = document.getElementById('homeBtn');
  if (Date.now() - exitArmed < 3000) return true;
  exitArmed = Date.now(); b.textContent = 'Leave?'; setTimeout(() => { if (b.isConnected) b.textContent = '←'; }, 3000);
  return false;
}
function toggleFlag(){
  const id = S.list[S.i].q.id;
  if (flags[id]) delete flags[id]; else flags[id] = 1;
  save('flags', flags);
  const b = document.getElementById('flagBtn'); b.classList.toggle('on', !!flags[id]); b.setAttribute('aria-pressed', !!flags[id]);
  const d = document.querySelector('.dot.cur'); if (d) d.classList.toggle('flag', !!flags[id]);
}
function reveal(q, chosen){
  const ok = chosen === q.answer;
  let h = `<div class="verdict ${ok ? 'ok' : 'bad'}"><span class="big">${ok ? '✓' : '✗'}</span><span>${ok ? 'Correct' : 'Not quite'}. The answer is ${q.answer}.</span></div>
    ${q.note ? `<div class="note">${esc(q.note)}</div>` : ''}<div class="exp">`;
  if (q.exp.O && q.exp.O.length) h += `<details class="xp" open><summary><span>Overall explanation</span></summary><div class="body">${paras(q.exp.O)}${figs(q, 'O')}</div></details>`;
  const order = [q.answer, ...Object.keys(q.options).filter(L => L !== q.answer)];
  for (const L of order){
    const isC = L === q.answer, isW = L === chosen && !isC;
    const body = (q.exp[L] && q.exp[L].length) ? paras(q.exp[L]) : (q.exp.O ? '' : `<p class="empty">No separate explanation was shown for this option.</p>`);
    if (!body && !isC && !figs(q, L)) continue;
    h += `<details class="xp ${isC ? 'is-correct' : ''} ${isW ? 'is-chosen' : ''}" ${isC || isW ? 'open' : ''}>
      <summary><span class="L">${L}</span><span>${esc(q.options[L] || '')}</span><span class="tag">${isC ? 'Correct' : isW ? 'Your answer' : 'Why not?'}</span></summary>
      <div class="body">${body || ''}${figs(q, L)}</div></details>`;
  }
  return h + figs(q, 'pre') + `</div>`;
}
function choose(L){
  const {q} = S.list[S.i];
  if (S.mode === 'exam' && !S.done){
    S.picks[q.id] = L;
    app.querySelectorAll('.opt').forEach(b => b.classList.toggle('picked', b.dataset.letter === L));
    const d = document.querySelector('.dot.cur'); if (d) d.classList.add('sel');
    return;
  }
  const ok = L === q.answer;
  if (S.mode === 'wrong') S.picks[q.id] = L;
  progress[q.id] = {c: L, ok, t: Date.now()}; save('progress', progress);
  streak = ok ? streak + 1 : 0;
  if (streak > best){ best = streak; save('best', best); }
  app.querySelectorAll('.opt').forEach(b => {
    b.disabled = true; const x = b.dataset.letter;
    if (x === q.answer){ b.classList.add('correct'); b.querySelector('.mark').textContent = '✓'; }
    else if (x === L){ b.classList.add('wrong'); b.querySelector('.mark').textContent = '✗'; }
    else b.classList.add('dim');
  });
  const card = document.getElementById('card'); card.classList.remove('enter', 'pulse', 'shake'); void card.offsetWidth; card.classList.add(ok ? 'pulse' : 'shake');
  const st = document.getElementById('streak');
  if (st){ st.querySelector('span').textContent = streak; st.classList.toggle('hot', streak >= 3); }
  const d = document.querySelector('.dot.cur'); if (d) d.classList.add(ok ? 'ok' : 'bad');
  const r = document.getElementById('reveal'); r.innerHTML = reveal(q, L);
  r.querySelectorAll('figure img').forEach(im => im.onclick = () => zoom(im.src));
  const next = document.getElementById('nextBtn'); if (S.i < S.list.length - 1) next.textContent = 'Next';
  setTimeout(() => r.firstElementChild.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start'}), 250);
}
function finishExam(){
  S.done = true; S.end = Date.now();
  for (const x of S.list){ const p = S.picks[x.q.id]; if (p) progress[x.q.id] = {c: p, ok: p === x.q.answer, t: Date.now()}; }
  save('progress', progress);
  results();
}
function results(){
  actions.hidden = true;
  let a = 0, c = 0;
  S.list.forEach(x => { const p = S.mode === 'exam' ? (S.picks[x.q.id] ? {ok: S.picks[x.q.id] === x.q.answer} : null) : progress[x.q.id]; if (p){ a++; if (p.ok) c++; } });
  const n = S.list.length;
  const mins = S.end ? Math.round((S.end - S.start) / 60000) : null;
  app.innerHTML = `<div class="top"><div class="row"><button class="iconbtn" type="button" id="homeBtn" aria-label="Back to systems">←</button>
      <div class="where"><div class="t">${esc(S.title)}</div><div class="s">Results</div></div></div></div>
    <section class="card result">
      ${ring(n, a, c, 150)}
      <div><div class="label">${esc(S.title)}</div><h2>${c} of ${n} correct</h2>
        <div class="stats" style="margin-top:10px"><span><b>${a ? Math.round(100 * c / a) : 0}%</b>accuracy</span><span><b>${n - a}</b>unanswered</span>${mins !== null ? `<span><b>${mins} min</b>time taken</span>` : ''}</div></div>
    </section>
    <h2 class="label group-h" style="margin-top:22px">Tap a question to review it</h2>
    <div class="dots" style="flex-wrap:wrap;overflow:visible">${S.list.map((x, k) => `<button class="${dotClass(x, -1)}" type="button" data-k="${k}" style="width:40px;height:40px;font-size:13px">${k + 1}</button>`).join('')}</div>
    <div class="modes" style="margin-top:22px;grid-template-columns:1fr"><button class="mode primary" type="button" id="againBtn"><strong>Back to systems</strong><span>Pick another set</span></button></div>`;
  window.scrollTo(0, 0);
  document.getElementById('homeBtn').onclick = home;
  document.getElementById('againBtn').onclick = home;
  app.querySelectorAll('.dot').forEach(d => d.onclick = () => { S.i = +d.dataset.k; render(); });
}
function tick(){
  const el = document.getElementById('timer');
  if (!el || !S || S.mode !== 'exam' || S.done) return;
  const s = Math.floor((Date.now() - S.start) / 1000);
  el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  setTimeout(tick, 1000);
}
function zoom(src){ document.getElementById('lbImg').src = src; document.getElementById('lightbox').hidden = false; }
function go(delta){
  if (!S) return;
  if (delta > 0 && S.i === S.list.length - 1){
    if (S.mode === 'exam' && !S.done) return finishExam();
    if (S.mode === 'exam' || S.mode === 'mix' || S.mode === 'wrong' || S.mode === 'flag' || S.mode === 'unseen' || S.mode === 'topic') return results();
  }
  const ni = S.i + delta; if (ni < 0 || ni >= S.list.length) return;
  S.i = ni; render();
}
document.getElementById('lightbox').onclick = () => document.getElementById('lightbox').hidden = true;
document.getElementById('prevBtn').onclick = () => go(-1);
document.getElementById('nextBtn').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (!S || actions.hidden) return;
  if (/^[a-e]$/i.test(e.key)){ const b = app.querySelector(`.opt[data-letter="${e.key.toUpperCase()}"]`); if (b && !b.disabled) b.click(); }
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
let tx = null, ty = null;
app.addEventListener('touchstart', e => { if (e.touches.length === 1 && !e.target.closest('.dots')){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = null; }, {passive: true});
app.addEventListener('touchend', e => {
  if (tx === null || !S || actions.hidden) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive: true});
boot();
</script>
</body></html>
